# Template — gate record
#
# A gate record is a FILE, not a field (docs/governance/quality-gates.md §6).
# The difference is not formal: a field can be set, a derived state cannot. The
# error catalogue holds three findings that all stem from an acceptance having
# been a field — F-A-52, F-A-53 and F-A-58, the last with significance
# "critical (data)": three contracts stood at `accepted` against a withdrawn
# acceptance.
#
# `state: ACCEPTED` is therefore NOT the initial value here. Whoever types it
# has accepted nothing — `scripts/gate_record.py::ist_abgenommen()` derives it,
# and it checks four conditions.
#
# Placement: one file per gate and subject, next to the subject.

# Which gate. From the closed set in quality-gates.md:
# HG-1 contract acceptance · HG-2 reconciliation · HG-3 cutover · HG-4 post-cutover
gate: HG-1

# What is being signed — and what the signature hangs on.
subject:
  kind: entity-contract        # entity-contract | recon-report | bundle | run-log
  path: contracts/<entity>.yaml
  # The hash of the subject at the time of submission. If it differs from
  # today's, the record is NOT accepted — what is changed after the signature is
  # unsigned again (RB-M1). This is the core of the whole mechanism.
  sha256: "<sha256 of the subject>"

# DRAFT -> IN_REVIEW -> ACCEPTED -> WITHDRAWN.
# Allowed edges are in scripts/gate_record.py; anything else is rejected.
# There is no second acceptance of the same record: whoever wants to accept
# again goes through WITHDRAWN.
state: DRAFT

# Who created the record and who pushed last. Neither may sign — otherwise the
# acceptance is a loop.
author: "<github-handle>"
last_pusher: "<github-handle>"

# Append-only. Every transition with time, role and review URL.
# An entry is never changed; a correction is a new entry (RB-P5).
history:
  - to: DRAFT
    at: "2026-01-01T00:00:00Z"
    by: "<github-handle>"
    role: data-architect
    review_url: null

# The required roles of THIS gate. Which they are is stated machine-readably in
# `scripts/gate_record.py::PFLICHT_ROLLEN` and normatively in quality-gates.md §4 —
# HG-1 requires data architect AND business side (`fachseite`), HG-2 data product
# owner AND data architect, HG-3 product lead (`produktverantwortlicher`) AND
# data architect, HG-4 only operations owner. A role does not sign, a human does:
# `handle` is required, not just `role` — and two roles in the same hand are one
# signature.
#
# Until 2026-09-08 this template stood on `gate: HG-1` with `data-product-owner`
# as the second signer. HG-1 does not know that role; it was an example that
# would not have passed its own gate.
#
# `at` must lie AFTER the last transition to IN_REVIEW. An approval from before
# applies to a different text.
signers:
  - role: data-architect
    handle: "<github-handle>"
    at: "2026-01-01T00:00:00Z"
    review_url: "https://github.com/<org>/<repo>/pull/<n>#pullrequestreview-<id>"
  - role: fachseite
    handle: "<other-github-handle>"
    at: "2026-01-01T00:00:00Z"
    review_url: "https://github.com/<org>/<repo>/pull/<n>#pullrequestreview-<id>"

# Check:
#   python3 -c "import sys,yaml;sys.path.insert(0,'scripts');import gate_record as g;\
#   r=yaml.safe_load(open('templates/gate-record.yaml'));print(g.ist_abgenommen(r,'x'))"
# Expected: (False, [...]) — a template is never accepted.
