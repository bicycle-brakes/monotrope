# Welche Modell-Endpunkte zugelassen sind — mit Betreiber, Residenz und
# Abrechnungsart.
#
# **Warum es diese Datei gibt.** `docs/WORKFLOW.md` regelt, WELCHES Modell in
# welcher Phase laeuft. Wo es laeuft und was es sehen darf, stand bis zum
# 2026-09-08 nirgends — weder im Regelwerk noch in einer Anleitung. Ein Agent
# konnte ein Modell nennen, und niemand hielt den Namen gegen etwas.
#
# **Nicht gelistet ist BLOCK.** Dieselbe Regel wie in den beiden Manifesten
# unter `scripts/`: ein Standard, der im Zweifel zulaesst, laesst genau die
# Endpunkte zu, an die niemand gedacht hat.
#
# Geprueft von `tests/test_model_endpoints.py` (RB-A6).

schema_version: 1

# ---------------------------------------------------------------------------
# Die Datenklassen — wonach sich entscheidet, was wohin darf
# ---------------------------------------------------------------------------
datenklassen:
  framework:
    was: "dieses Repository: Regeln, Vorlagen, Ablauf, Tests"
    bemerkung: "oeffentlich vorgesehen (lakeswitch-ai); keine Residenzauflage"
  kundencode:
    was: "Quellcode und Schemata aus der Projekt-Instanz — PL/SQL, DDL, Contract-Instanzen"
    bemerkung: >-
      Traegt Struktur und Bezeichner des Kunden. Auflage: nur Endpunkte mit
      residenz != 'nicht-erklaert'. Ein Modell, das Kundencode sieht, sieht das
      Datenmodell des Kunden — auch ohne eine einzige Zeile Nutzdaten.
  kundendaten:
    was: "Zeilen aus Quell- oder Zielsystemen"
    bemerkung: >-
      Verlaesst die Umgebung des Kunden nicht. Kein hier gelisteter Endpunkt ist
      dafuer zugelassen; die Reconciliation laeuft im Warehouse, nicht im Modell.

# ---------------------------------------------------------------------------
# Die zugelassenen Endpunkte
# ---------------------------------------------------------------------------
#
# `abrechnung` ist nicht Buchhaltung, sondern eine Auflage: ein Abonnement-Plan
# ist auf offiziell unterstuetzte Werkzeuge begrenzt. Wer sein Kontingent durch
# eine eigene Integration fahren will, braucht einen token-basierten Zugang —
# sonst ist die Nutzung nicht gedeckt, unabhaengig davon, ob sie technisch geht.
endpunkte:
  - name: anthropic-api
    betreiber: Anthropic
    residenz: anbieter-erklaert
    abrechnung: token
    darf_sehen: [framework, kundencode]
    modelle:
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-4-5
      - claude-opus-5-5
      - claude-sonnet-5-5
    bemerkung: >-
      Erstanbieter. `inference_geo` ist ein Parameter der Messages API und kann
      die Region festlegen, wo der Anbieter es unterstuetzt.

  - name: claude-code-plan
    betreiber: Anthropic
    residenz: anbieter-erklaert
    abrechnung: abonnement
    darf_sehen: [framework, kundencode]
    modelle:
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-4-5
      - claude-opus-5-5
      - claude-sonnet-5-5
    bemerkung: >-
      Der Harness, in dem hier gearbeitet wird. **Nur ueber offiziell
      unterstuetzte Werkzeuge.** Das Kontingent durch eine eigene Integration
      oder ein fremdes Werkzeug zu fahren, ist nicht gedeckt — wer eine eigene
      Integration baut, nimmt `anthropic-api`.
      Entscheidung des Maintainers vom 2026-09-23 (Omnigent M0, Bead
      coding-harness-eev): Startet Omnigent das offizielle Claude-Code-Programm
      (`omnigent claude`), das sich selbst mit dem Abo anmeldet, behandelt
      dieses Repository das als offiziell unterstuetztes Werkzeug. Nicht gegen
      Anthropics Nutzungsbedingungen geprueft — das ist eine Einordnung des
      Maintainers, keine Feststellung. Nicht gedeckt bleiben das Agent SDK,
      eigene API-Aufrufe mit den Abo-Zugangsdaten und jede Integration, die
      Claude Code umgeht. Annahme, von M0 zu messen: Das Kostenlimit von
      Omnigent zaehlt beim Abo nicht mit; die Grenze setzen das Abo-Kontingent
      und das Limit fuer Werkzeugaufrufe pro Sitzung.

  - name: bedrock-claude
    betreiber: "Amazon Web Services (Claude gehostet)"
    residenz: region-waehlbar
    abrechnung: token
    darf_sehen: [framework, kundencode]
    modelle:
      - claude-opus-5
      - claude-sonnet-5
    bemerkung: >-
      Vorgesehen, hier nicht in Benutzung. Steht in der Liste, damit die
      Alternative bei einer Residenzauflage benannt ist und nicht im Moment der
      Auflage erst gesucht wird.

  # -------------------------------------------------------------------------
  # Stage 2 — other vendors review (docs/WORKFLOW.md §4, ADR 0007)
  # -------------------------------------------------------------------------
  #
  # `darf_sehen: [framework]` ist hier die entscheidende Zeile, nicht die
  # Residenz. Dieses Repository ist als oeffentlich vorgesehen; was es enthaelt,
  # ist Regelwerk, Vorlage und Ablauf. Kundencode traegt Struktur und Bezeichner
  # eines Kunden und geht an keinen dieser Endpunkte — auch nicht in einem Diff,
  # auch nicht in einem Plan. Durchgesetzt wird das nicht durch diese Zeile,
  # sondern durch `make leakcheck` vor jeder Sitzung an einem Fremdendpunkt.

  - name: glm-coding-plan
    betreiber: "Zhipu AI (Z.ai)"
    residenz: anbieter-erklaert
    abrechnung: abonnement
    darf_sehen: [framework]
    modelle:
      - glm-5.3
      - glm-5.3-flash
    bemerkung: >-
      Anthropic-compatible endpoint (`https://api.z.ai/api/anthropic`), operated
      in China. No review phase routes to it since 2026-10-07 (ADR 0011): the
      review loop (phase 4b) moved to `opencode-go`. `glm-5.3-flash` explores
      (phase 1) through `stage2.py explore` and implements (phase 4) through
      `stage2.py implement` (maintainer, 2026-10-06; bead
      coding-harness-qcp). `glm-5.3` repairs the findings the orchestrator takes
      through `stage2.py repair` (maintainer, 2026-10-12; ADR 0015). **Only
      through Claude Code**, which the vendor lists
      as a supported tool — an own integration would not be covered by the
      subscription.

  - name: openai-codex
    betreiber: OpenAI
    residenz: anbieter-erklaert
    abrechnung: abonnement
    darf_sehen: [framework]
    modelle:
      - gpt-6.1-sol
    bemerkung: >-
      Codex through the official Codex CLI only, signed in with the
      maintainer's ChatGPT subscription — any other way in is not covered.
      Used for the spec review (phase 2a) and the review (phase 6) of
      `bounded`, `feature` and `architectural` changes, through `python3
      scripts/stage2.py`; the review loop (phase 4b) moved to `opencode-go`
      (ADR 0011). OpenAI states that
      it processes and stores
      personal-plan data in the United States and wherever its affiliates and
      service providers are, and personal plans get no region choice (search
      summaries of OpenAI's pages, 2026-09-30).

  - name: opencode-go
    betreiber: "OpenCode (Operator Anomaly Innovations, Inc.)"
    residenz: anbieter-erklaert
    abrechnung: abonnement
    darf_sehen: [framework]
    modelle:
      - deepseek-v4.1-flash
      - mimo-v2.6-flash
      - mimo-v2.6-pro
    bemerkung: >-
      The review loop (phase 4b) and the interactive session verb (`stage2.py
      session`, ADR 0012) run here — and nothing else; the spec review (phase
      2a) and the review (phase 6) stay with Codex — through `python3
      scripts/stage2.py` and Pi at the version the runner pins (1.1.0) only. The order of `modelle` is the loop's ladder: round n
      calls the n-th id, and a one-line pull request reorders it. Address:
      `https://opencode.ai/zen/go/v1/chat/completions`, under which the Go
      page (read 2026-10-07) lists the three ids; the Anthropic-compatible
      `https://opencode.ai/zen/go/v1/messages` is not used — three calls
      there were refused on 2026-10-08. The Go page lists Pi among its
      validated clients (read 2026-10-08), and Pi sends the
      `x-opencode-session` header the page asks for.
      Subscription: the Go plan at USD 10 a month. Prices per million
      tokens and monthly limit on the Go plan: `deepseek-v4.1-flash` USD 0.15
      input / 0.60 output off-peak and 0.30 / 1.20 in peak hours, limit USD
      60; `mimo-v2.6-flash` 0.14 / 0.28, limit USD 60; `mimo-v2.6-pro` 0.435
      / 0.87, limit USD 15. Privacy table of the Go page (read 2026-10-07):
      data retention `0 days` and model training "Not used" for all three;
      the DeepSeek rows carry the footnote that the ZDR agreement is renewed
      monthly and the current one is valid through 2026-10-31. The Go page
      states no region; `anbieter-erklaert` rests on the Zen page's sentence
      "All our models are hosted in the US and EU." (read 2026-10-07) and is
      corrected the day OpenCode states where Go runs. Terms
      reading of 2026-10-08: the terms of service (effective 2026-08-15) name
      no third-party client and forbid processes that "automatically or
      programmatically extracts data or Output" and that run "while you are
      not logged into the Services"; the maintainer accepted this residual
      risk on 2026-10-08.

# ---------------------------------------------------------------------------
# Nutzungszweck — die Auflage, die kein technisches Gate prueft
# ---------------------------------------------------------------------------
#
# Beide Abonnements oben sind als **persoenliche** Nutzung ausgewiesen. Ob die
# Arbeit an diesem Repository davon gedeckt ist, ist eine Vertragsfrage und
# keine technische; sie wird deshalb hier mit Datum vermerkt und nicht in einem
# Skript beantwortet.
#
# **Stand 2026-09-10:** vom Eigentuemer erklaert — dieses Projekt ist zum
# jetzigen Zeitpunkt ein persoenliches, die Nutzung damit gedeckt.
#
# Die Erklaerung traegt ihr Datum, weil sie an einen Zustand gebunden ist. Sie
# ist **neu einzuholen**, sobald eines von dreien eintritt: das Projekt wird
# kommerziell betrieben, `lakeswitch-ai` geht oeffentlich, oder eine
# Auftraggeberin bezahlt Arbeit, die durch diese Endpunkte laeuft. Ein Vermerk
# ohne Verfallsbedingung liest sich beim naechsten Mal wie eine Dauerzusage.
#
# **2026-09-30, the ChatGPT subscription behind `openai-codex`:** declared
# personal use by the owner on the same terms as above. To be obtained again
# under the same three conditions — the project is run commercially,
# `lakeswitch-ai` goes public, or a client pays for work that runs through this
# endpoint. The account's setting "Improve the model for everyone" is off: the
# maintainer switched it off on 2026-09-30 and said so in the conversation that
# day (an agent did not read it in the account).

# ---------------------------------------------------------------------------
# Ausdruecklich NICHT zugelassen
# ---------------------------------------------------------------------------
#
# Eine Verbotsliste ersetzt die Zulassungsliste nicht — nicht gelistet ist
# ohnehin BLOCK. Sie steht hier, weil ein benannter Ausschluss eine
# Entscheidung dokumentiert, waehrend Schweigen wie ein Versehen aussieht.
ausgeschlossen:
  - was: "Endpunkte ohne erklaerte Datenresidenz"
    klasse: kundencode
    grund: >-
      Kundencode traegt Struktur und Bezeichner des Kunden. Ohne erklaerte
      Residenz ist nicht beantwortbar, wo diese Struktur liegt — und die Frage
      wird erst gestellt, wenn die Antwort teuer ist.
  - was: "jeder Endpunkt fuer die Klasse kundendaten"
    klasse: kundendaten
    grund: >-
      Zeilen verlassen die Umgebung des Kunden nicht. Das ist keine Frage des
      Anbieters, sondern der Architektur: die Maschine baut die Pipeline, sie
      liest die Daten nicht.
  - was: "Kimi (Moonshot AI; models k3 and kimi-for-coding)"
    klasse: framework
    grund: >-
      Dropped by the maintainer on 2026-09-30 — stage 2 reviews with Codex and
      GLM (ADR 0007).
