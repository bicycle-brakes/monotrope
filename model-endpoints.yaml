    # Legacy membership for declarations without availability_preflight.
    # Fresh runs of this declaration select the cheapest reachable members.
    availability_preflight:
      flash_size: 3
      max_age_seconds: 900
      # GLM through OpenCode Go works (maintainer, 2026-10-18); the GLM outage
      # until 2026-10-21T20:34+08:00 covers the Z.ai route only, which this
      # preparation never probes.
      exclude_until: []
    # `mimo-v2.6-flash` left the ladder on 2026-10-20: OpenCode Go answers it with
    # `[model_coming_soon] This model is coming soon.` on every call (bead
    # coding-harness-mkg, measured 2026-10-16 and still on 2026-10-19), so every
    # review loop stopped after round 1. `mimo-v2.6-pro` takes the third place.
    # The maintainer reports it answering again on 2026-10-22; it returns to the
    # `modelle` set, and the availability preparation probes it before every run.
    flash_swarm:
      - deepseek-v4.1-flash
      - longcat-2.0
      - mimo-v2.6-pro
    free_stage:
      provider: opencode-go
      id_suffix: "-free"
      include: []
      exclude:
        - id: step-5-preview-free
          date: "2026-10-17"
          reason: >-
            In the freshly fetched opencode-go overlay, but every call fails
            with "Upstream request failed: Model is unavailable" (loop round 1
            and the runner's probe, both 2026-10-17); excluding it saves a
            call that fails every time until the model is served.
      input: implementation-diff
      hinweis: >-
        Class admission instead of individual declarations: every id this
        run's forced live catalog refresh finds under the provider, matching
        the suffix or an include, reviews the implementation diff with no
        tools (ADR 0021, decision 3). The retention and training terms of
        these ids are NOT read; this acceptance covers the diff-only review
        purpose alone — no paid model, no Zen id and no interactive session
        runs on it.
    bemerkung: >-
      The review loop (phase 4b), the interactive session verb (`stage2.py
      session`, ADR 0012) and, since ADR 0020, the research swarm's Go calls
      declared below (finders, repository-topic and online seats, free seats;
      their number per run grows with the free seats) run here; the spec review (phase
      2a) runs on Opus 5.5 and the review (phase 6) on Codex — through
      `python3
      scripts/stage2.py` and Pi at the version the runner pins — the exact
      version `tools/pi/package.json` declares, the repository's own install
      (ADR 0019) — only. The loop runs until a round is clean (ADR 0021):
      round 1 is the discovered free-model swarm, round 2 the parallel
      `flash_swarm`, then one eligible `modelle` id per round, cheapest first:
      the runner orders the set by `anfragen_5h` descending, ties by id, a
      model without the value last and named. A Flash member that fails is
      replaced by the cheapest admitted model not in the round and not yet
      consumed, each model at most once; the swap is recorded and printed.
      Fresh runs require availability_preflight: prepare-loop checks actual
      reachability without tools or repository content, then the main Claude
      Code or Codex conversation reports the selected stages before
      review-loop --availability-reported consumes its input-bound receipt.
      The receipt expires after 900 seconds. Up to three cheapest reachable
      admitted paid models form the Flash swarm; remaining reachable models
      form the ladder. The flash_swarm list is legacy configuration only.
      Timed exclusions are skipped without probing. Existing runs retain
      their snapshots; availability preparation cannot reset consumed stages.
      A one-line pull request changes the set or a value. Free membership is
      selected fresh for every run by the `free_stage` rule from a forced
      live catalog refresh (`pi update --models`) before `pi --list-models`;
      the catalog's source is `pi.dev`, which Pi caches for four hours — the
      forced refresh skips that cache — and being an intermediary it does not
      measure what Go actually bills. A paid model enters only with a dated
      reading of its retention and training terms in `modelle_terms`; a model
      without one is skipped and named for the handover. Address:
      `https://opencode.ai/zen/go/v1/chat/completions`, under which the Go
      page (read 2026-10-07) listed the three measured ids; the
      Anthropic-compatible
      `https://opencode.ai/zen/go/v1/messages` is not used — three calls
      there were refused on 2026-10-08. As of 2026-10-17, `qwen3.8-flash`,
      `claude-haiku-5-5` and `minimax-m3` use anthropic-messages in Pi's
      shipped catalog; `gpt-6-luna` uses openai-responses. All four are
      skipped: wire API not measured. Their data-terms admission under Q-11
      stands; a probe must measure their real address before use.
      The Go page lists Pi among its
      validated clients (read 2026-10-08), and Pi sends the
      `x-opencode-session` header the page asks for.
      Subscription: the Go plan at USD 10 a month. Prices per million
      tokens and monthly limit on the Go plan: `deepseek-v4.1-flash` USD 0.15
      input / 0.60 output off-peak and 0.30 / 1.20 in peak hours, limit USD
      60; `mimo-v2.6-pro` 0.435 / 0.87, limit USD 15. Privacy table of the Go
      page (read 2026-10-07): data retention `0 days` and model training
      "Not used" for both;
      the DeepSeek rows carry the footnote that the ZDR agreement is renewed
      monthly and the current one is valid through 2026-10-31. The Go page
      states no region; `anbieter-erklaert` rests on the Zen page's sentence
      "All our models are hosted in the US and EU." (read 2026-10-07) and is
      corrected the day OpenCode states where Go runs. Terms
      reading of 2026-10-08: the terms of service (effective 2026-08-15) name
      no third-party client and forbid processes that "automatically or
      programmatically extracts data or Output" and that run "while you are
      not logged into the Services"; the maintainer accepted this residual
      risk on 2026-10-08. The six ids beyond the three measured ones
      (`longcat-2.0`, `glm-5.3-flash`, `qwen3.8-flash`, `gpt-6-luna`,
      `claude-haiku-5-5`, `minimax-m2.7`) came from the maintainer's ladder
      answer of 2026-10-14 without their own wire measurements. The estimated
      requests per five hours (`anfragen_5h`, Go page read 2026-10-17) are
      `longcat-2.0` 11400, `glm-5.3-flash` 6320, `qwen3.8-flash` 5400,
      `gpt-6-luna` 4230, `claude-haiku-5-5` 3850 and the replacement
      `minimax-m3` 3200. No token price is claimed for these six.
      Privacy table of the Go page (read 2026-10-17):
      `longcat-2.0`, `glm-5.3-flash` and `qwen3.8-flash` retain `0 days`,
      `gpt-6-luna` (abuse-monitoring logs) and `claude-haiku-5-5` retain
      `30 days`, and model training is "Not used" for all five; the
      maintainer admitted all five on 2026-10-17, the 30-day ones included.
      The Go page lists Claude Haiku 5.5 as `claude-haiku-5-5`, so the ladder
      carries that id. `minimax-m2.7` is neither on the page nor in Pi's
      live `opencode-go` catalog of 2026-10-16, which list `minimax-m3`
      instead (`0 days`, "Not used"); the maintainer replaced it with
      `minimax-m3` on 2026-10-17. The free class accepts unread terms for the
      implementation diff only: no tools and no other content, and no paid
      model, Zen id or interactive session on that acceptance (ADR 0021,
      decision 3).

# ---------------------------------------------------------------------------
# Der Recherche-Schwarm (ADR 0020, vorgeschlagen bis zum Merge) — wer in welcher Rolle laeuft
# ---------------------------------------------------------------------------
#
# Die Rollen sind hier DEKLARIERT, nicht in einem Skript hardkodiert: der
# Schwarm-Lauf liest diesen Block und lehnt jede Rolle ab, deren Endpunkt oder
# Modell hier nicht so steht, wie die Rolle sie braucht. Ausnahme: fehlt
# `finder_merge`, nimmt der Lauf still das Modell von `judge`
# (scripts/stage2_availability.py); wer `judge` aendert, aendert also auch den
# Merge der Finder. Der Block aendert
# NICHT die Reihenfolge von `opencode-go.modelle` — die bleibt die Leiter der
# Review-Schleife (phase 4b).
research_swarm:
  paid_endpoint: claude-code-plan
  topic_author: claude-opus-5-5
  judge: claude-opus-5-5
  # Six seats (Q-12, Q-14, Q-18). A seat is either pinned to one `{endpoint,
  # model}` or open (`{endpoint: opencode-go}` alone). At preparation
  # (`stage2.py prepare-explore`) the runner probes the admitted Go models and
  # fills each open seat with the cheapest reachable one (`anfragen_5h`
  # descending, ties by id) that no other seat of its trio holds; an unreachable
  # pinned model is replaced the same way and reported as "substitute for <seat>".
  # It prints every reachable candidate with its request cost and its Artificial
  # Analysis Intelligence Index, read live at each preparation, and a
  # recommendation. The orchestrator asks the maintainer which models to use
  # before the run; a different answer goes back as `prepare-explore --seats`
  # and is never silently replaced. A `modelle_terms` record alone admits a Go
  # model for research; `opencode-go.modelle` stays the review ladder. Go seats
  # name no model since 2026-10-21: the Flash models change too often (Q-18).
  repository_seats:
    - {endpoint: opencode-go}
    - {endpoint: opencode-go}
    - {endpoint: claude-code-plan, model: claude-haiku-5-5}
  online_seats:
    - {endpoint: opencode-go}
    - {endpoint: opencode-go}
    - {endpoint: opencode-go}
  # Go id -> Artificial Analysis slug, only where the id does not match the
  # slug or name by itself; an unmatched model shows its intelligence as not read.
  intelligence_slugs: {}
  availability_preflight:
    max_age_seconds: 900
    exclude_until: []
    measured_wire_apis: [openai-completions]
  online_free: {provider: opencode-go, suffix: "-free", include: [], exclude: []}

# ---------------------------------------------------------------------------
# Nutzungszweck — die Auflage, die kein technisches Gate prueft
# ---------------------------------------------------------------------------
#
# Beide Abonnements oben sind als **persoenliche** Nutzung ausgewiesen. Ob die
# Arbeit an diesem Repository davon gedeckt ist, ist eine Vertragsfrage und
# keine technische; sie wird deshalb hier mit Datum vermerkt und nicht in einem
# Skript beantwortet.
#
# **Stand 2026-09-10:** vom Eigentuemer erklaert — dieses Projekt ist zum
# jetzigen Zeitpunkt ein persoenliches, die Nutzung damit gedeckt.
#
# Die Erklaerung traegt ihr Datum, weil sie an einen Zustand gebunden ist. Sie
# ist **neu einzuholen**, sobald eines von dreien eintritt: das Projekt wird
# kommerziell betrieben, `lakeswitch-ai` geht oeffentlich, oder eine
# Auftraggeberin bezahlt Arbeit, die durch diese Endpunkte laeuft. Ein Vermerk
# ohne Verfallsbedingung liest sich beim naechsten Mal wie eine Dauerzusage.
#
# **2026-09-30, the ChatGPT subscription behind `openai-codex`:** declared
# personal use by the owner on the same terms as above. To be obtained again
# under the same three conditions — the project is run commercially,
# `lakeswitch-ai` goes public, or a client pays for work that runs through this
# endpoint. The account's setting "Improve the model for everyone" is off: the
# maintainer switched it off on 2026-09-30 and said so in the conversation that
# day (an agent did not read it in the account).

# ---------------------------------------------------------------------------
# Ausdruecklich NICHT zugelassen
# ---------------------------------------------------------------------------
#
# Eine Verbotsliste ersetzt die Zulassungsliste nicht — nicht gelistet ist
# ohnehin BLOCK. Sie steht hier, weil ein benannter Ausschluss eine
# Entscheidung dokumentiert, waehrend Schweigen wie ein Versehen aussieht.
ausgeschlossen:
  - was: "Endpunkte ohne erklaerte Datenresidenz"
    klasse: kundencode
    grund: >-
      Kundencode traegt Struktur und Bezeichner des Kunden. Ohne erklaerte
      Residenz ist nicht beantwortbar, wo diese Struktur liegt — und die Frage
      wird erst gestellt, wenn die Antwort teuer ist.
  - was: "jeder Endpunkt fuer die Klasse kundendaten"
    klasse: kundendaten
    grund: >-
      Zeilen verlassen die Umgebung des Kunden nicht. Das ist keine Frage des
      Anbieters, sondern der Architektur: die Maschine baut die Pipeline, sie
      liest die Daten nicht.
  - was: "Kimi (Moonshot AI; models k3 and kimi-for-coding)"
    klasse: framework
    grund: >-
      Dropped by the maintainer on 2026-09-30 — stage 2 reviews with Codex and
      GLM (ADR 0007).
