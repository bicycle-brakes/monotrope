# Welche Modell-Endpunkte zugelassen sind — mit Betreiber, Residenz und
# Abrechnungsart.
#
# **Warum es diese Datei gibt.** `docs/WORKFLOW.md` regelt, WELCHES Modell in
# welcher Phase laeuft. Wo es laeuft und was es sehen darf, stand bis zum
# 2026-09-08 nirgends — weder im Regelwerk noch in einer Anleitung. Ein Agent
# konnte ein Modell nennen, und niemand hielt den Namen gegen etwas.
#
# **Nicht gelistet ist BLOCK.** Dieselbe Regel wie in den beiden Manifesten
# unter `scripts/`: ein Standard, der im Zweifel zulaesst, laesst genau die
# Endpunkte zu, an die niemand gedacht hat.
#
# Geprueft von `tests/test_model_endpoints.py` (RB-A6).

schema_version: 1

# ---------------------------------------------------------------------------
# Die Datenklassen — wonach sich entscheidet, was wohin darf
# ---------------------------------------------------------------------------
datenklassen:
  framework:
    was: "dieses Repository: Regeln, Vorlagen, Ablauf, Tests"
    bemerkung: "oeffentlich vorgesehen (lakeswitch-ai); keine Residenzauflage"
  kundencode:
    was: "Quellcode und Schemata aus der Projekt-Instanz — PL/SQL, DDL, Contract-Instanzen"
    bemerkung: >-
      Traegt Struktur und Bezeichner des Kunden. Auflage: nur Endpunkte mit
      residenz != 'nicht-erklaert'. Ein Modell, das Kundencode sieht, sieht das
      Datenmodell des Kunden — auch ohne eine einzige Zeile Nutzdaten.
  kundendaten:
    was: "Zeilen aus Quell- oder Zielsystemen"
    bemerkung: >-
      Verlaesst die Umgebung des Kunden nicht. Kein hier gelisteter Endpunkt ist
      dafuer zugelassen; die Reconciliation laeuft im Warehouse, nicht im Modell.
  public-web:
    was: "Oeffentlich zugaengliche Quellen: Suchergebnisse und abgerufene Webseiten"
    bemerkung: >-
      Nur fuer die oeffentliche Forschungsstufe des Recherche-Scharms (ADR 0020,
      vorgeschlagen bis zum Merge). Kein Repositorien-Inhalt und keine Kundenbezuege — zu einem Aufruf
      auf dieser Klasse verlaesst nur der gefilterte Ein-Satz-Themensatz die
      Grenze; die Antworten der Modelle sind Daten, kein Beweis fuer Lokales.

# ---------------------------------------------------------------------------
# Die zugelassenen Endpunkte
# ---------------------------------------------------------------------------
#
# `abrechnung` ist nicht Buchhaltung, sondern eine Auflage: ein Abonnement-Plan
# ist auf offiziell unterstuetzte Werkzeuge begrenzt. Wer sein Kontingent durch
# eine eigene Integration fahren will, braucht einen token-basierten Zugang —
# sonst ist die Nutzung nicht gedeckt, unabhaengig davon, ob sie technisch geht.
endpunkte:
  - name: anthropic-api
    betreiber: Anthropic
    residenz: anbieter-erklaert
    abrechnung: token
    darf_sehen: [framework, kundencode]
    modelle:
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-5-5
      - claude-opus-5-5
      - claude-sonnet-5-5
    bemerkung: >-
      Erstanbieter. `inference_geo` ist ein Parameter der Messages API und kann
      die Region festlegen, wo der Anbieter es unterstuetzt.

  - name: claude-code-plan
    betreiber: Anthropic
    residenz: anbieter-erklaert
    abrechnung: abonnement
    darf_sehen: [framework, kundencode]
    modelle:
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-5-5
      - claude-opus-5-5
      - claude-sonnet-5-5
    bemerkung: >-
      Der Harness, in dem hier gearbeitet wird. **Nur ueber offiziell
      unterstuetzte Werkzeuge.** Das Kontingent durch eine eigene Integration
      oder ein fremdes Werkzeug zu fahren, ist nicht gedeckt — wer eine eigene
      Integration baut, nimmt `anthropic-api`.
      Entscheidung des Maintainers vom 2026-09-23 (Omnigent M0, Bead
      coding-harness-eev): Startet Omnigent das offizielle Claude-Code-Programm
      (`omnigent claude`), das sich selbst mit dem Abo anmeldet, behandelt
      dieses Repository das als offiziell unterstuetztes Werkzeug. Nicht gegen
      Anthropics Nutzungsbedingungen geprueft — das ist eine Einordnung des
      Maintainers, keine Feststellung. Nicht gedeckt bleiben das Agent SDK,
      eigene API-Aufrufe mit den Abo-Zugangsdaten und jede Integration, die
      Claude Code umgeht. Annahme, von M0 zu messen: Das Kostenlimit von
      Omnigent zaehlt beim Abo nicht mit; die Grenze setzen das Abo-Kontingent
      und das Limit fuer Werkzeugaufrufe pro Sitzung.

  - name: bedrock-claude
    betreiber: "Amazon Web Services (Claude gehostet)"
    residenz: region-waehlbar
    abrechnung: token
    darf_sehen: [framework, kundencode]
    modelle:
      - claude-opus-5
      - claude-sonnet-5
    bemerkung: >-
      Vorgesehen, hier nicht in Benutzung. Steht in der Liste, damit die
      Alternative bei einer Residenzauflage benannt ist und nicht im Moment der
      Auflage erst gesucht wird.

  # -------------------------------------------------------------------------
  # Stage 2 — other vendors review (docs/WORKFLOW.md §4, ADR 0007)
  # -------------------------------------------------------------------------
  #
  # `darf_sehen: [framework]` ist hier die entscheidende Zeile, nicht die
  # Residenz. Dieses Repository ist als oeffentlich vorgesehen; was es enthaelt,
  # ist Regelwerk, Vorlage und Ablauf. Kundencode traegt Struktur und Bezeichner
  # eines Kunden und geht an keinen dieser Endpunkte — auch nicht in einem Diff,
  # auch nicht in einem Plan. Durchgesetzt wird das nicht durch diese Zeile,
  # sondern durch `make leakcheck` vor jeder Sitzung an einem Fremdendpunkt.

  - name: glm-coding-plan
    betreiber: "Zhipu AI (Z.ai)"
    residenz: anbieter-erklaert
    abrechnung: abonnement
    darf_sehen: [framework]
    modelle:
      - glm-5.3
      - glm-5.3-flash
    bemerkung: >-
      Anthropic-compatible endpoint (`https://api.z.ai/api/anthropic`), operated
      in China. No review phase routes to it since 2026-10-07 (ADR 0011): the
      review loop (phase 4b) moved to `opencode-go`. `glm-5.3-flash` explores
      (phase 1) through `stage2.py explore` — since ADR 0020 only for a
      `bounded` or `spike` change, while a `feature` or `architectural` change
      explores through the research swarm declared below — and implements
      (phase 4) through
      `stage2.py implement` (maintainer, 2026-10-06; bead
      coding-harness-qcp). `glm-5.3` repaired the findings the orchestrator took
      until ADR 0017, which moved `stage2.py repair` to Codex (maintainer,
      2026-10-13; the repair route reads no GLM credential), and drafts
      spec, design and plan (phases 2, 2b and 3) through `stage2.py draft` when
      two Codex attempts failed (maintainer, 2026-10-12; ADR 0016). **Only
      through Claude Code**, which the vendor lists
      as a supported tool — an own integration would not be covered by the
      subscription.

  - name: openai-codex
    betreiber: OpenAI
    residenz: anbieter-erklaert
    abrechnung: abonnement
    darf_sehen: [framework]
    modelle:
      - gpt-6.1-sol
    bemerkung: >-
      Codex through the official Codex CLI only, signed in with the
      maintainer's ChatGPT subscription — any other way in is not covered.
      Used for drafting spec, design and plan (phases 2, 2b and 3) through
      `stage2.py draft` and repairing taken findings through `stage2.py repair`
      (ADR 0017), writing in the CLI's workspace-write sandbox, and for
      the review (phase 6) of `bounded`, `feature` and `architectural` changes,
      through `python3 scripts/stage2.py`; the spec review (phase 2a) moved to
      Opus 5.5 (ADR 0016) and the review loop (phase 4b) moved to
      `opencode-go` (ADR 0011). OpenAI states that
      it processes and stores
      personal-plan data in the United States and wherever its affiliates and
      service providers are, and personal plans get no region choice (search
      summaries of OpenAI's pages, 2026-09-30).

