name: verify

# GENERATED by `python3 scripts/ci_gates.py --generate-ci` from decisions/gates.yaml (D-10).
# Hand-edits fail the ci-drift gate on purpose.

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        id: setup-deps
        run: python3 -m pip install pytest==8.3.4 PyYAML ruff==0.9.10
      - name: Markdown passes the linter
        id: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !docs/journal/**
        continue-on-error: true
      - name: External links resolve
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md docs/
        continue-on-error: true
      - name: The test suite passes
        id: pytest
        run: python3 -m pytest tests/ -q
      - name: The linter finds nothing
        id: ruff-check
        run: python3 -m ruff check scripts/ tests/
      - name: Every file is already formatted
        id: ruff-format
        run: python3 -m ruff format --check scripts/ tests/
      - name: The kit probe holds over the tracked tree
        id: leerprobe
        run: python3 scripts/kit/probe.py --strict
      - name: Plans hygiene holds (built means archived, no one-sided handover)
        id: plans-registry
        run: python3 scripts/plans_registry.py --check
      - name: Documentation frontmatter, links and anchors resolve
        id: docs-links
        run: python3 scripts/check_docs.py
        continue-on-error: true
      - name: The rendered bead export parses line by line
        id: bead-export
        run: python3 scripts/check_bead_export.py
      - name: Every cited bead id resolves in the export
        id: dangling-beads
        run: python3 scripts/check_dangling_bead_ids.py
      - name: This gate file satisfies its own schema
        id: gate-schema
        run: python3 scripts/ci_gates.py --check-schema
      - name: ci.yml is exactly what the gate file generates
        id: ci-drift
        run: python3 scripts/ci_gates.py --check-ci
      - name: ramp valves — dated transitions turn loud on their date
        id: ramp-valves
        run: python3 scripts/ramp_valves.py
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        id: setup-deps
        run: python3 -m pip install pytest==8.3.4 PyYAML ruff==0.9.10
      - name: Plans hygiene holds strictly against the outside world
        id: plans-registry-strict
        run: python3 scripts/plans_registry.py --check --strict
