name: verify

# GENERATED by `python3 scripts/ci_gates.py --generate-ci` from decisions/gates.yaml (D-10).
# Hand-edits fail the ci-drift gate on purpose.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up the declared interpreter
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned toolchain
        id: setup-deps
        run: python3 -m pip install --require-hashes -r requirements-ci.txt
      - name: Set up the declared Node runtime
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: tools/pi/.node-version
      - name: Install the pinned Pi
        id: setup-pi
        run: bash tools/pi/install.sh
      - name: Hydrate the tracker (pinned bd, checksum-verified)
        id: setup-tracker
        run: |
          bash tools/beads/install.sh
          git fetch origin refs/dolt/data:refs/dolt/data
          header="$(git config --local http.https://github.com/.extraheader || true)"
          if [ -n "$header" ]; then
            git config --global http.https://github.com/.extraheader "$header"
            git config --local --unset-all http.https://github.com/.extraheader
          fi
          bash tools/bd bootstrap --yes
          mkdir -p .beads
          python3 scripts/render_beads_export.py
          echo "BEAD_RENDER=$PWD/.beads/issues.jsonl" >> "$GITHUB_ENV"
      - name: Markdown passes the linter
        id: markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !docs/journal/**
            !tools/pi/node_modules/**
        continue-on-error: true
      - name: External links resolve
        id: lychee
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md docs/
        continue-on-error: true
      - name: The test suite passes
        id: pytest
        if: ${{ !cancelled() }}
        run: python3 -m pytest tests/ -q -n auto
      - name: The linter finds nothing
        id: ruff-check
        if: ${{ !cancelled() }}
        run: python3 -m ruff check scripts/ tests/
      - name: Every file is already formatted
        id: ruff-format
        if: ${{ !cancelled() }}
        run: python3 -m ruff format --check scripts/ tests/
      - name: The kit probe holds over the tracked tree
        id: leerprobe
        if: ${{ !cancelled() }}
        run: python3 scripts/kit/probe.py --strict
      - name: Plans hygiene holds (built means archived, no one-sided handover)
        id: plans-registry
        if: ${{ !cancelled() }}
        run: python3 scripts/plans_registry.py --check
      - name: Documentation frontmatter, links and anchors resolve
        id: docs-links
        if: ${{ !cancelled() }}
        run: python3 scripts/check_docs.py
        continue-on-error: true
      - name: Every held document's updated date is current
        id: frontmatter-current
        if: ${{ !cancelled() }}
        run: python3 scripts/check_frontmatter_current.py
      - name: The rendered bead export parses line by line
        id: bead-export
        if: ${{ !cancelled() }}
        run: python3 scripts/check_bead_export.py
      - name: Every cited bead id resolves in the export
        id: dangling-beads
        if: ${{ !cancelled() }}
        run: python3 scripts/check_dangling_bead_ids.py
      - name: Every interview decision stays mapped; every amendment has its ADR
        id: decision-continuity
        if: ${{ !cancelled() }}
        run: python3 scripts/check_decision_continuity.py
      - name: Every feature has the maintainer's answer to the ADR question
        id: adr-answers
        if: ${{ !cancelled() }}
        run: python3 scripts/check_adr_answers.py
      - name: The phase-1a interview is owed where the class minimums stand
        id: interview-minimums
        if: ${{ !cancelled() }}
        run: python3 scripts/check_interview_minimums.py
      - name: Every new answered interview record keeps its context
        id: question-context
        if: ${{ !cancelled() }}
        run: python3 scripts/check_question_context.py
      - name: Every test a plan names for an acceptance criterion still exists
        id: criterion-ledger
        if: ${{ !cancelled() }}
        run: python3 scripts/check_criterion_ledger.py
      - name: This gate file satisfies its own schema
        id: gate-schema
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_gates.py --check-schema
      - name: ci.yml is exactly what the gate file generates
        id: ci-drift
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_gates.py --check-ci
      - name: ramp valves — dated transitions turn loud on their date
        id: ramp-valves
        if: ${{ !cancelled() }}
        run: python3 scripts/ramp_valves.py
  verify:
    needs: gates
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Every leg of the gates passed
        run: |
          echo "gates: ${{ needs.gates.result }}"
          test "${{ needs.gates.result }}" = success
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the declared interpreter
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned toolchain
        id: setup-deps
        run: python3 -m pip install --require-hashes -r requirements-ci.txt
      - name: Set up the declared Node runtime
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: tools/pi/.node-version
      - name: Install the pinned Pi
        id: setup-pi
        run: bash tools/pi/install.sh
      - name: Hydrate the tracker (pinned bd, checksum-verified)
        id: setup-tracker
        run: |
          bash tools/beads/install.sh
          git fetch origin refs/dolt/data:refs/dolt/data
          header="$(git config --local http.https://github.com/.extraheader || true)"
          if [ -n "$header" ]; then
            git config --global http.https://github.com/.extraheader "$header"
            git config --local --unset-all http.https://github.com/.extraheader
          fi
          bash tools/bd bootstrap --yes
          mkdir -p .beads
          python3 scripts/render_beads_export.py
          echo "BEAD_RENDER=$PWD/.beads/issues.jsonl" >> "$GITHUB_ENV"
      - name: Plans hygiene holds strictly against the outside world
        id: plans-registry-strict
        if: ${{ !cancelled() }}
        run: python3 scripts/plans_registry.py --check --strict
      - name: Research notes not reviewed for more than 90 days are listed
        id: research-currency
        if: ${{ !cancelled() }}
        run: python3 scripts/check_research_currency.py
        continue-on-error: true
