# GENERATED by scripts/omnigent_policy.py from its one list of Omnigent tools. Do not edit.
# Change the list, then run: python3 scripts/omnigent_policy.py --write
# Installed per machine, by the maintainer, in a terminal: tools/omnigent/install.sh
# See tools/omnigent/README.md.
policies:
  coding_harness__omnigent_writing_tools:
    type: function
    handler: omnigent.policies.builtins.cel.cel_policy
    factory_params:
      reason: "coding-harness: this Omnigent tool writes, runs, spawns or changes state."
      expression: |-
        has(event.type) && type(event.type) == string && event.type == "tool_call"
        && has(event.data) && type(event.data) == map
        && has(event.data.name) && type(event.data.name) == string
        && event.data.name in [
          "sys_os_write",
          "sys_os_edit",
          "sys_os_shell",
          "sys_agent_download",
          "sys_terminal_launch",
          "sys_terminal_send",
          "sys_terminal_close",
          "sys_session_create",
          "sys_session_send",
          "sys_session_close",
          "sys_session_rename",
          "sys_session_share",
          "sys_scheduled_task_create",
          "sys_scheduled_task_update",
          "sys_scheduled_task_delete",
          "sys_call_async",
          "sys_cancel_async",
          "sys_cancel_task",
          "sys_read_inbox",
          "sys_add_policy",
          "update_comment",
          "browser_navigate",
          "browser_click",
          "browser_type",
          "hindsight_retain",
          "hindsight_recall",
          "hindsight_reflect",
          "mcp__omnigent__sys_os_write",
          "mcp__omnigent__sys_os_edit",
          "mcp__omnigent__sys_os_shell",
          "mcp__omnigent__sys_agent_download",
          "mcp__omnigent__sys_terminal_launch",
          "mcp__omnigent__sys_terminal_send",
          "mcp__omnigent__sys_terminal_close",
          "mcp__omnigent__sys_session_create",
          "mcp__omnigent__sys_session_send",
          "mcp__omnigent__sys_session_close",
          "mcp__omnigent__sys_session_rename",
          "mcp__omnigent__sys_session_share",
          "mcp__omnigent__sys_scheduled_task_create",
          "mcp__omnigent__sys_scheduled_task_update",
          "mcp__omnigent__sys_scheduled_task_delete",
          "mcp__omnigent__sys_call_async",
          "mcp__omnigent__sys_cancel_async",
          "mcp__omnigent__sys_cancel_task",
          "mcp__omnigent__sys_read_inbox",
          "mcp__omnigent__sys_add_policy",
          "mcp__omnigent__update_comment",
          "mcp__omnigent__browser_navigate",
          "mcp__omnigent__browser_click",
          "mcp__omnigent__browser_type",
          "mcp__omnigent__hindsight_retain",
          "mcp__omnigent__hindsight_recall",
          "mcp__omnigent__hindsight_reflect"
        ]
        ? {"result": "DENY", "reason": "coding-harness: Omnigent's " + event.data.name + " writes, runs, spawns or changes state outside Claude Code's permission rules - use the harness's own tools (list: scripts/omnigent_policy.py)"}
        : null
  coding_harness__protected_paths:
    type: function
    handler: omnigent.policies.builtins.cel.cel_policy
    factory_params:
      reason: "coding-harness: this file carries Omnigent's policy."
      expression: |-
        has(event.type) && type(event.type) == string && event.type == "tool_call"
        && has(event.data) && type(event.data) == map
        && has(event.data.name) && type(event.data.name) == string
        && event.data.name in ["Write", "Edit", "MultiEdit"]
        && has(event.data.arguments) && type(event.data.arguments) == map
        && has(event.data.arguments.file_path) && type(event.data.arguments.file_path) == string
        && (event.data.arguments.file_path.endsWith("/.omnigent/config.yaml"))
        ? {"result": "DENY", "reason": "coding-harness: " + event.data.arguments.file_path + " carries Omnigent's policy; only the maintainer changes it (tools/omnigent/install.sh)"}
        : null
