# Was den Coding-Ablauf ausmacht — und was ihn nur in DIESEM Repo beschreibt.
#
# Die Regel, die diese Datei noetig macht, ist dieselbe wie beim Export-Manifest:
# **eine nicht klassifizierte Datei ist ein BLOCK, kein "gehoert dazu by
# default".** Ein Standard, der im Zweifel mitnimmt, uebergibt genau die Dateien,
# an die niemand gedacht hat — und das sind erfahrungsgemaess die, die den
# Bestand dieses Repos behaupten.
#
# Aufloesung: **laengster passender Praefix gewinnt** — wer eine Ausnahme
# braucht, schreibt einen laengeren Praefix daneben.
#
# Diese Datei beantwortet eine ANDERE Frage als scripts/export/manifest.yaml.
# Dort: "was geht nach lakeswitch-ai". Hier: "was macht den Ablauf aus". Eine
# Datei darf in beiden vorkommen; welche Kombinationen sich widersprechen, haelt
# tests/test_kit.py::test_the_two_manifests_do_not_contradict_each_other.
#
# `python3 scripts/kit/probe.py` faehrt die Menge in einem Wegwerf-Repo.

schema_version: 1

# Ordner, die im Zielrepo LEER existieren muessen. Getrennt von den
# `geruest`-Regeln: ein Praefix `plans/changes/` haette jede Datei darunter mit
# erfasst, und das sind die Artefakte DIESES Repos. Der Ordner reist, sein
# Inhalt nicht.
geruest_ordner:
  - plans/changes
  - plans/changes/archive
  - plans/specs

# ---------------------------------------------------------------------------
# Die zwei Rollen
# ---------------------------------------------------------------------------
#
# Zwei haetten gereicht, wenn nicht eine Datei existieren muesste, deren INHALT
# Bestand ist. `.beads/issues.jsonl` war der Fall: ohne eine Exportdatei sammelt
# pytest nicht einmal, mit DIESER Exportdatei behauptete das fremde Repo 570
# fremde Vorgaenge (gemessen am 2026-09-08). Seit bead 1jg.3 (Schritt zwei,
# 2026-09-23) reist die Datei nicht mehr — der Render-Vertrag hat sie abgeloest
# und die Rolle gleich mit: ihr letztes getracktes Mitglied fiel auf genau das
# Export-Verdict zurueck, das der Export-Manifest ohnehin traegt (AK-6) — eine
# Dublette, keine zweite Frage. Die Rumpf-Pflege fuer model-endpoints.yaml und
# requirements-ci.txt wohnt weiterhin im Export-Manifest.
rollen:
  mechanismus:
    was: "traegt den Ablauf und laeuft in einem fremden Repo unveraendert"
    bedingung: "faellt in der Leerprobe gruen aus, oder steht mit Grund in probe.REIST_NICHT"
  bestand:
    was: "beschreibt die Inventur DIESES Repos und bleibt hier"
    bedingung: "der Grund steht in der Regel, nicht im Kopf des Uebergebenden"

# ---------------------------------------------------------------------------
# Die Regeln
# ---------------------------------------------------------------------------
rules:
